name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Syntax
        run: zsh -n src/cynkra-endpoint-check.sh

      - name: Unit tests with stubbed system commands
        run: zsh tests/run.zsh

      - name: Real run on the runner (offline checks)
        run: |
          mkdir -p "$RUNNER_TEMP/run" && cd "$RUNNER_TEMP/run"
          zsh "$GITHUB_WORKSPACE/src/cynkra-endpoint-check.sh" check --offline --json > report.json || true
          python3 - <<'PY'
          import json
          d = json.load(open("report.json"))
          for key in ("date", "user", "host", "device_id", "macos", "failed", "checks"):
              assert key in d, key
          names = {c["check"] for c in d["checks"]}
          for check in ("FileVault", "Firewall", "Gatekeeper", "SIP", "Screen lock", "macOS version"):
              assert check in names, check
          assert all(c["status"] in ("PASS", "FAIL", "WARN", "INFO") for c in d["checks"])
          print(f"{len(d['checks'])} checks in the report, {d['failed']} failed on the runner")
          PY

      - name: Formula
        run: |
          brew tap cynkra/tap "$GITHUB_WORKSPACE"
          brew audit --strict cynkra/tap/cynkra-endpoint-check
          brew install cynkra/tap/cynkra-endpoint-check
          brew test cynkra/tap/cynkra-endpoint-check
          # the service runs at login and once a day; Homebrew drops interval unless run_type is :interval
          plist="$(brew --prefix cynkra-endpoint-check)/sh.brew.cynkra-endpoint-check.plist"
          test "$(plutil -extract StartInterval raw "$plist")" = 86400
          test "$(plutil -extract RunAtLoad raw "$plist")" = true
